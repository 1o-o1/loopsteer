  - {grid: B, card: edit-site map, model: ouro_2_6b_base,  cells: {D1: done, CF: done, D2: done, D4: done, D5: run}}
  - {grid: B, card: edit-site map, model: ouro_1_4b_think, cells: {D1: run, CF: run, D2: run, D4: run, D5: run}}
  - {grid: B, card: edit-site map, model: ouro_2_6b_think, cells: {D1: run, CF: run, D2: run, D4: run, D5: run}}
  - {grid: B, card: edit-site map, model: ifm_p1_ouro,     cells: {D1: run, CF: run, D2: run, D4: run, D5: run}}
  - {grid: B, card: edit-site map, model: ifm_p1_ouro_inj, cells: {D1: run, CF: run, D2: run, D4: run, D5: run}}
