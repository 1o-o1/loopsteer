  - {grid: B, card: edit-site map, model: ifm_p2m_r5,      cells: {D1: run, CF: run, D2: run, D4: run, D5: run}}
  - {grid: B, card: edit-site map, model: ifm_p2m_diag,    cells: {D1: run, CF: run, D2: run, D4: run, D5: run}}
  - {grid: B, card: edit-site map, model: ifm_p2m_ortho,   cells: {D1: run, CF: run, D2: run, D4: run, D5: run}}
  - {grid: B, card: edit-site map, model: ifm_d28,         cells: {D1: run, CF: run, D2: run, D4: run, D5: run}}
  - {grid: B, card: edit-site map, model: ifm_d112,        cells: {D1: run, CF: run, D2: run, D4: run, D5: run}}
