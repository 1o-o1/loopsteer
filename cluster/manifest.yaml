# Machine-readable copy of notes/ra_cluster_manifest_AB_2026-10-09.md: grids A and B, the decay and schedule
# rows, the C and D scripts of the script table, the queue order, and the section "Not run on the cluster".
# Transcribed by the code chat on 2026-10-08. Names follow cluster/cells_skipped.json (model registry names,
# dataset codes, card names) so the two files join on (card, model, dataset).
# Cell words as in the manifest:
#   run  = run at the full pool          done = already at the full pool, do not rerun
#   scan = the clean-pass scan decides    skip = not run, with its reason (ability, design, time)
#   scope = in "Not run on the cluster" (2026-10-09), with the manifest's reason
# note = the manifest's own words for the cell. Skips for missing script support ("time") are not repeated here:
# they live in cells_skipped.json, which gen_jobs.py and merge.py read.
version: 2
source: notes/ra_cluster_manifest_AB_2026-10-09.md

datasets:   # pool = the manifest's "Sizes and cost" pool, before the clean-pass filter
  D1: {label: "facts (capital, city)", pool: 267}
  CF: {label: "CounterFact (subject split)", pool: 598}
  D2: {label: "addition", pool: 263}
  D4: {label: "code (read, sum)", pool: 160}
  D5: {label: "two-step math", pool: 160}
  VB: {label: "GSM8K copy (VarBench pairs)", pool: 1198}
  VBD: {label: "GSM8K derived", pool: 848}
  GSM8K_gen: {label: "GSM8K generation pairs", pool: 522}
  SVAMP_gen: {label: "SVAMP generation pairs", pool: 300}
  SENT300: {label: "sentiment, 300 new neutral prompts", pool: 300}
  D3: {label: "countries", pool: 76}
  LRE: {label: "relational facts, the 47-relation linear-relations set (RA-23 item 5)", pool: 350}
  ASDIV_gen: {label: "ASDiv generation pairs (RA-23 item 4)", pool: 1114}
  MAWPS_gen: {label: "MAWPS generation pairs (RA-23 item 4)", pool: 2082}

models:   # in the manifest's row order; last: true = Huginn and Parcae, last in every queue group
  - {id: ouro_1_4b_base, label: "Ouro 1.4B base"}
  - {id: ouro_2_6b_base, label: "Ouro 2.6B base"}
  - {id: ouro_1_4b_think, label: "Ouro 1.4B Thinking"}
  - {id: ouro_2_6b_think, label: "Ouro 2.6B Thinking"}
  - {id: ifm_p1_ouro, label: "IFM no-injection"}
  - {id: ifm_p1_ouro_inj, label: "IFM injection twin"}
  - {id: ifm_p1_mid, label: "IFM middle pair, no injection"}
  - {id: ifm_p1_mid_inj, label: "IFM middle pair, prelude injection"}
  - {id: ifm_p2m_r5, label: "819M design fixed-r5"}
  - {id: ifm_p2m_diag, label: "819M design fixed-pln5"}
  - {id: ifm_p2m_ortho, label: "819M design orthoinj"}
  - {id: ifm_d28, label: "d28"}
  - {id: ifm_d112, label: "d112"}
  - {id: mcleish_llama32_r32, label: "McLeish r32"}
  - {id: llama_nr, label: "McLeish non-recurrent twin"}
  - {id: huginn_0125, label: "Huginn K32", last: true}
  - {id: parcae_370m, label: "Parcae 370m", last: true}
  - {id: parcae_1_3b, label: "Parcae 1.3b", last: true}

rows:   # the manifest tables' rows (RA-20 item 9: the shared set is the items every model of a row keeps).
        # A model not listed in a grid is its own row. Grids C, D and E list no rows.
  A:
    - {id: ifm_family, label: "IFM no-injection, injection twin, middle pair, 819M, d28, d112", models: [ifm_p1_ouro, ifm_p1_ouro_inj, ifm_p1_mid, ifm_p1_mid_inj, ifm_p2m_r5, ifm_p2m_diag, ifm_p2m_ortho, ifm_d28, ifm_d112]}
    - {id: parcae, label: "Parcae 370m, 1.3b", models: [parcae_370m, parcae_1_3b]}
  B:
    - {id: ifm_mid_pair, label: "IFM middle pair (both)", models: [ifm_p1_mid, ifm_p1_mid_inj]}
    - {id: ifm_819m, label: "819M designs (three)", models: [ifm_p2m_r5, ifm_p2m_diag, ifm_p2m_ortho]}
    - {id: d28_d112, label: "d28, d112", models: [ifm_d28, ifm_d112]}
    - {id: mcleish_pair, label: "McLeish r32 and non-recurrent twin", models: [mcleish_llama32_r32, llama_nr]}
    - {id: parcae, label: "Parcae 370m, 1.3b", models: [parcae_370m, parcae_1_3b]}

groups:   # "Order and budget", in queue order
  - {id: g1_copy, label: "(1) GSM8K copy and derived at the full pool"}
  - {id: g2_gen, label: "(2) generation, GSM8K then SVAMP"}
  - {id: g3_map, label: "(3) edit-site map at full pools"}
  - {id: g4_cd, label: "(4) C and D scripts on the models they load"}
  - {id: g5_huginn, label: "(5) Huginn edit-site and copy cells"}

# One entry per (grid, card, model); cells maps dataset -> status or [status, note/reason].
cells:
  # ---- Grid A: generation placement (run-1 rows; batch of run 1) ----
  - {grid: A, card: generation placement, model: ouro_1_4b_base,  cells: {GSM8K_gen: [run, "150 done; the rest of the pool"], SVAMP_gen: [run, "after the RA-18 build"]}}
  - {grid: A, card: generation placement, model: ouro_2_6b_base,  cells: {GSM8K_gen: [run, "same"], SVAMP_gen: run}}
  - {grid: A, card: generation placement, model: ouro_1_4b_think, cells: {GSM8K_gen: [run, "chat template"], SVAMP_gen: run}}
  - {grid: A, card: generation placement, model: ouro_2_6b_think, cells: {GSM8K_gen: [run, "chat template"], SVAMP_gen: run}}
  - {grid: A, card: generation placement, model: ifm_p1_ouro,     cells: {GSM8K_gen: [scan, "clean solve rate low; the copy run kept 60 problems by the copy criterion, not by solving"], SVAMP_gen: scan}}
  - {grid: A, card: generation placement, model: ifm_p1_ouro_inj, cells: {GSM8K_gen: scan, SVAMP_gen: scan}}
  - {grid: A, card: generation placement, model: ifm_p1_mid,      cells: {GSM8K_gen: scan, SVAMP_gen: scan}}
  - {grid: A, card: generation placement, model: ifm_p1_mid_inj,  cells: {GSM8K_gen: scan, SVAMP_gen: scan}}
  - {grid: A, card: generation placement, model: ifm_p2m_r5,      cells: {GSM8K_gen: scan, SVAMP_gen: scan}}
  - {grid: A, card: generation placement, model: ifm_p2m_diag,    cells: {GSM8K_gen: scan, SVAMP_gen: scan}}
  - {grid: A, card: generation placement, model: ifm_p2m_ortho,   cells: {GSM8K_gen: scan, SVAMP_gen: scan}}
  - {grid: A, card: generation placement, model: ifm_d28,         cells: {GSM8K_gen: scan, SVAMP_gen: scan}}
  - {grid: A, card: generation placement, model: ifm_d112,        cells: {GSM8K_gen: scan, SVAMP_gen: scan}}
  - {grid: A, card: generation placement, model: mcleish_llama32_r32, cells: {GSM8K_gen: [run, "started this week on the fast card; the cluster takes the rest of the pool"], SVAMP_gen: run}}
  - {grid: A, card: generation placement, model: huginn_0125,     cells: {GSM8K_gen: [run, "same"], SVAMP_gen: run}}
  - {grid: A, card: generation placement, model: parcae_370m,     cells: {GSM8K_gen: scan, SVAMP_gen: scan}}
  - {grid: A, card: generation placement, model: parcae_1_3b,     cells: {GSM8K_gen: scan, SVAMP_gen: scan}}
  - {grid: A, card: "appendix: loop-2 contrast", model: ouro_1_4b_base, cells: {GSM8K_gen: [scope, "descriptive result; the frozen test needs a new strength; no claim depends on it"]}}
  - {grid: A, card: "appendix: LoopCD accuracy rows", model: ouro_1_4b_think, cells: {GSM8K_gen: [scope, "claim dropped (no effect beyond drift)"]}}

  # ---- Grid B: GSM8K copy (VB) and derived (VBD); the map columns are below ----
  - {grid: B, card: GSM8K copy and derived, model: ouro_1_4b_base,  cells: {VB: [done, "1,053 pairs (production)"], VBD: [run, "RA-19 item 5: derived at the full pool"]}}
  - {grid: B, card: GSM8K copy and derived, model: ouro_2_6b_base,  cells: {VB: [done, "1,069 (production)"], VBD: [run, "RA-19 item 5"]}}
  - {grid: B, card: GSM8K copy and derived, model: ouro_1_4b_think, cells: {VB: [run, "pilot 190; full pool"], VBD: run}}
  - {grid: B, card: GSM8K copy and derived, model: ouro_2_6b_think, cells: {VB: run, VBD: run}}
  - {grid: B, card: GSM8K copy and derived, model: ifm_p1_ouro,     cells: {VB: [run, "60 done; full pool"], VBD: run}}
  - {grid: B, card: GSM8K copy and derived, model: ifm_p1_ouro_inj, cells: {VB: [run, "60 done; full pool"], VBD: run}}
  - {grid: B, card: GSM8K copy and derived, model: ifm_p1_mid,      cells: {VB: run, VBD: run}}
  - {grid: B, card: GSM8K copy and derived, model: ifm_p1_mid_inj,  cells: {VB: run, VBD: run}}
  - {grid: B, card: GSM8K copy and derived, model: ifm_p2m_r5,      cells: {VB: run, VBD: run}}
  - {grid: B, card: GSM8K copy and derived, model: ifm_p2m_diag,    cells: {VB: run, VBD: run}}
  - {grid: B, card: GSM8K copy and derived, model: ifm_p2m_ortho,   cells: {VB: run, VBD: run}}
  - {grid: B, card: GSM8K copy and derived, model: ifm_d28,         cells: {VB: run, VBD: run}}
