  - {grid: B, card: edit-site map, model: parcae_370m,     cells: {D1: [run, "61 done"], CF: scan, D2: [skip, "ability (clean filter 0 to 3 percent, ledger 2026-10-08 02:10)"], D4: [skip, "ability (same)"], D5: [skip, "ability (same)"]}}
  - {grid: B, card: edit-site map, model: parcae_1_3b,     cells: {D1: [run, "62 done"], CF: scan, D2: [skip, "ability (same)"], D4: [skip, "ability (same)"], D5: [skip, "ability (same)"]}}

  # ---- Decay and schedule rows of B ----
  - {grid: B, card: decay and schedule rows (sentiment), model: ouro_1_4b_base,  cells: {SENT300: [run, "300 new neutral prompts; loop-1-to-2 rule registered before launch"]}}
  - {grid: B, card: decay and schedule rows (sentiment), model: ouro_2_6b_base,  cells: {SENT300: run}}
